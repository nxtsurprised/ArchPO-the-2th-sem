apiVersion: v1
kind: Pod
metadata:
  name: dns-check
  namespace: databases
  labels:
    app.kubernetes.io/name: dns-check
    app.kubernetes.io/part-of: archpo-platform
    app.kubernetes.io/managed-by: manual-validation
spec:
  restartPolicy: Never
  containers:
    - name: dns-check
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - sleep 3600
