apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pmi-agent
  namespace: argocd
  annotations:
    archpo.local/optional: "true"
    archpo.local/reason: "AI agent is heavy for mandatory local k3d E2E"
spec:
  project: default
  source:
    repoURL: https://github.com/nxtsurprised/ArchPO-the-2th-sem.git
    targetRevision: part-3
    path: platform/helm/pmi-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
