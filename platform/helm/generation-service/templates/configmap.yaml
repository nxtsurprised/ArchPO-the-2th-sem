apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "generation-service.fullname" . }}-config
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "generation-service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.connections.kafka.enabled }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.connections.kafka.bootstrapServers | quote }}
  {{- end }}
  {{- if .Values.connections.redis.enabled }}
  REDIS_URL: {{ .Values.connections.redis.url | quote }}
  {{- end }}
  {{- if .Values.connections.minio.enabled }}
  MINIO_ENDPOINT: {{ .Values.connections.minio.endpoint | quote }}
  {{- end }}
