replicaCount: 1

image:
  repository: "k3d-archpo-registry:5000/generation-service"
  tag: "manual-test"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  create: true
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8003"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8003

env:
  LOG_LEVEL: INFO
  ENVIRONMENT: local
  APP_VERSION: "1.0.0"
  CATALOG_SERVICE_URL: http://catalog-service:8002
  AUTH_SERVICE_URL: http://auth-service:8001
  MINIO_BUCKET: documents
  MINIO_TEMPLATES_BUCKET: templates
  MINIO_ARCHIVE_BUCKET: documents-archive
  MINIO_SECURE: "false"

connections:
  kafka:
    enabled: true
    bootstrapServers: archpo-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  redis:
    enabled: true
    url: redis://redis.databases.svc.cluster.local:6379/0
  postgres:
    enabled: false
    host: postgres.databases.svc.cluster.local
    port: 5432
    database: generation_db
    existingSecret: postgres-secret
  mongodb:
    enabled: false
    uriExistingSecret: mongo-secret
  minio:
    enabled: true
    endpoint: minio.databases.svc.cluster.local:9000
    existingSecret: minio-secret
  chroma:
    enabled: false
    url: http://chroma.databases.svc.cluster.local:8005
  ollama:
    enabled: false
    url: http://ollama.infra.svc.cluster.local:11434

existingSecrets:
  appShared: app-shared-secrets
  minio: minio-secret
  redis: redis-secret

secretEnv:
  create: false
  data: {}

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi

probes:
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
