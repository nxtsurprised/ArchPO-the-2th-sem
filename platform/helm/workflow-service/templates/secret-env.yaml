{{- if .Values.secretEnv.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workflow-service.fullname" . }}-manual-env
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "workflow-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
