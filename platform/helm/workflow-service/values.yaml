replicaCount: 1

image:
  repository: "k3d-archpo-registry:5000/workflow-service"
  tag: "manual-test"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  create: true
  annotations: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8004"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8004

env:
  LOG_LEVEL: INFO
  ENVIRONMENT: local
  APP_VERSION: "1.0.0"
  CATALOG_INTERNAL_URL: http://catalog-service:8002
  JWKS_URL: http://auth-service:8001/.well-known/jwks.json

connections:
  kafka:
    enabled: true
    bootstrapServers: archpo-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  redis:
    enabled: false
    url: redis://redis.databases.svc.cluster.local:6379/0
  postgres:
    enabled: true
    host: postgres.databases.svc.cluster.local
    port: 5432
    database: workflow_db
    existingSecret: postgres-secret
  mongodb:
    enabled: false
    uriExistingSecret: mongo-secret
  minio:
    enabled: false
    endpoint: http://minio.databases.svc.cluster.local:9000
    existingSecret: minio-secret
  chroma:
    enabled: false
    url: http://chroma.databases.svc.cluster.local:8005
  ollama:
    enabled: false
    url: http://ollama.infra.svc.cluster.local:11434

existingSecrets:
  appShared: app-shared-secrets
  jwt: jwt-secrets
  postgres: postgres-secret
  redis: redis-secret

secretEnv:
  create: false
  data: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
