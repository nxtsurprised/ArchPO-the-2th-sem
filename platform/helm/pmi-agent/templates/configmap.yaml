apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pmi-agent.fullname" . }}-config
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "pmi-agent.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.connections.redis.enabled }}
  REDIS_URL: {{ .Values.connections.redis.url | quote }}
  {{- end }}
  {{- if .Values.connections.chroma.enabled }}
  CHROMA_HOST: {{ .Values.connections.chroma.host | quote }}
  CHROMA_PORT: {{ .Values.connections.chroma.port | quote }}
  {{- end }}
  {{- if .Values.connections.ollama.enabled }}
  OLLAMA_BASE_URL: {{ .Values.connections.ollama.url | quote }}
  {{- end }}
