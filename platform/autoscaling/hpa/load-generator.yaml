apiVersion: v1
kind: Pod
metadata:
  name: hpa-load-generator
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - "while true; do wget -q -O- http://hpa-demo.default.svc.cluster.local; done"
