apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
data:
  platform-alerts.yml: |
    groups:
      - name: platform.rules
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus target is down"
              description: "Target {{ $labels.job }}/{{ $labels.instance }} has been down for more than 2 minutes."

          - alert: HighHTTPErrorRate
            expr: |
              (
                sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
                /
                clamp_min(sum(rate(http_requests_total[5m])) by (job), 1)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP 5xx error rate"
              description: "Job {{ $labels.job }} has more than 5% HTTP 5xx responses for 5 minutes."

          - alert: HighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 HTTP latency"
              description: "Job {{ $labels.job }} has p95 latency above 1 second for 5 minutes."

          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod is restarting often"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 10 minutes."
