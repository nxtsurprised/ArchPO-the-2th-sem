---
- name: Ensure Kafka namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kafka_namespace }}"

- name: Download Strimzi Cluster Operator manifest
  ansible.builtin.get_url:
    url: "{{ strimzi_operator_manifest_url }}"
    dest: "{{ strimzi_operator_manifest_path }}"
    mode: "0644"

- name: Set Strimzi operator namespace in downloaded manifest
  ansible.builtin.replace:
    path: "{{ strimzi_operator_manifest_path }}"
    regexp: "namespace: myproject"
    replace: "namespace: {{ kafka_namespace }}"

- name: Apply Strimzi Cluster Operator manifest
  kubernetes.core.k8s:
    state: present
    namespace: "{{ kafka_namespace }}"
    src: "{{ strimzi_operator_manifest_path }}"

- name: Wait for Strimzi Cluster Operator readiness
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: strimzi-cluster-operator
    namespace: "{{ kafka_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_sleep: 5
    wait_timeout: 180

- name: Apply Kafka cluster custom resource
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'kafka-cluster.yaml.j2') | from_yaml_all | list }}"

- name: Wait for Kafka custom resource readiness
  kubernetes.core.k8s_info:
    api_version: kafka.strimzi.io/v1beta2
    kind: Kafka
    name: "{{ kafka_cluster_name }}"
    namespace: "{{ kafka_namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_sleep: 10
    wait_timeout: 600

- name: Apply Kafka topic custom resource
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'kafka-topic.yaml.j2') | from_yaml }}"

- name: Apply Kafka user custom resource when enabled
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'kafka-user.yaml.j2') | from_yaml }}"
  when: kafka_user_enabled | bool
