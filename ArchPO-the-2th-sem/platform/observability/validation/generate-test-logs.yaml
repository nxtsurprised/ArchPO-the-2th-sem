apiVersion: batch/v1
kind: Job
metadata:
  name: observability-test-logs
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-test-logs
    app.kubernetes.io/part-of: observability
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-test-logs
        app: observability-test-logs
    spec:
      restartPolicy: Never
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while [ "$i" -lt 20 ]; do
                echo "{\"level\":\"info\",\"service\":\"observability-test\",\"message\":\"test log line\",\"iteration\":${i}}"
                i=$((i + 1))
                sleep 2
              done
              echo "{\"level\":\"warn\",\"service\":\"observability-test\",\"message\":\"finished log generation\"}"
