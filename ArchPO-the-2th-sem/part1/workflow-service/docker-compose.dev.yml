# Override for local development with JWT_PUBLIC_KEY_PATH instead of JWKS_URL
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  workflow-service:
    volumes:
      - ./tests/fixtures/jwt_public.pem:/app/jwt_public.pem:ro
    environment:
      JWKS_URL: ""
      JWT_PUBLIC_KEY_PATH: /app/jwt_public.pem
      DB_HOST: workflow-postgres
      DB_PORT: 5432
      DB_NAME: workflow_db
      DB_USER: workflow_user
      DB_PASSWORD: workflow_pass
