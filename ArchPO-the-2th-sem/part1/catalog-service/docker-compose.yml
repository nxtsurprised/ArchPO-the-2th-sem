version: "3.9"

services:

  catalog-service:
    build:
      context: ..          # build context = part1/ (чтобы включить shared/)
      dockerfile: catalog-service/Dockerfile
    image: catalog-service:latest
    container_name: catalog-service
    ports:
      - "8002:8002"
    environment:
      MONGO_HOST: catalog-mongodb
      MONGO_PORT: 27017
      MONGO_DB: catalog_db
      MONGO_USER: catalog_user
      MONGO_PASSWORD: catalog_secret
      # Production: verify JWT via Auth Service JWKS
      JWKS_URL: http://auth-service:8001/.well-known/jwks.json
      JWT_PUBLIC_KEY_PATH: ""
      AUTH_SERVICE_URL: http://auth-service:8001
      WORKFLOW_SERVICE_URL: http://workflow-service:8004
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      APP_VERSION: "1.0.0"
    depends_on:
      catalog-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - catalog-net

  catalog-mongodb:
    image: mongo:7
    container_name: catalog-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_user
      MONGO_INITDB_ROOT_PASSWORD: catalog_secret
      MONGO_INITDB_DATABASE: catalog_db
    volumes:
      - catalog-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - catalog-net

  catalog-seed:
    build:
      context: ..
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-seed
    command: python -m seeds.seed_templates
    environment:
      MONGO_HOST: catalog-mongodb
      MONGO_PORT: 27017
      MONGO_DB: catalog_db
      MONGO_USER: catalog_user
      MONGO_PASSWORD: catalog_secret
    depends_on:
      catalog-mongodb:
        condition: service_healthy
    networks:
      - catalog-net
    restart: "no"

networks:
  catalog-net:
    driver: bridge

volumes:
  catalog-mongo-data:
