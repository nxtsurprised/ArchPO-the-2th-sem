groups:
  - name: services
    interval: 30s
    rules:

      # ── Любой сервис недоступен ───────────────────────────────────────────
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.job }} недоступен"
          description: "Prometheus не получает метрики с {{ $labels.job }} более 1 минуты."

  - name: pmi_agent
    interval: 30s
    rules:

      # ── LLM fallback слишком часто ────────────────────────────────────────
      - alert: HighFallbackRate
        expr: increase(pmi_fallback_total[10m]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "LLM часто уходит в fallback"
          description: "За последние 10 минут fallback сработал {{ $value }} раз(а)."

      # ── Пайплайн завершился ошибкой ───────────────────────────────────────
      - alert: PipelineFailure
        expr: increase(pmi_runs_total{status="failed"}[10m]) >= 1
        for: 0m
        labels:
          severity: error
        annotations:
          summary: "PMI-пайплайн завершился с ошибкой"
          description: "За последние 10 минут зафиксировано {{ $value }} упавших запусков."

      # ── Черновой прогон слишком долго ─────────────────────────────────────
      - alert: SlowDraftPipeline
        expr: histogram_quantile(0.95, rate(pmi_draft_duration_seconds_bucket[15m])) > 400
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Составление черновика занимает слишком долго"
          description: "p95 времени draft-пайплайна превысил 400 секунд."
