global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8001"]
    metrics_path: /metrics

  - job_name: "catalog-service"
    static_configs:
      - targets: ["catalog-service:8002"]
    metrics_path: /metrics

  - job_name: "generation-service"
    static_configs:
      - targets: ["generation-service:8003"]
    metrics_path: /metrics

  - job_name: "workflow-service"
    static_configs:
      - targets: ["workflow-service:8004"]
    metrics_path: /metrics

  - job_name: "pmi-agent"
    static_configs:
      - targets: ["pmi-agent:8006"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
