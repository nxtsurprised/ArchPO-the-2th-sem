services:

  generation-service:
    build:
      context: ..          # build context = part1/ (чтобы включить shared/)
      dockerfile: generation-service/Dockerfile
    image: generation-service:latest
    container_name: generation-service
    ports:
      - "8003:8003"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8002
      AUTH_SERVICE_URL: http://auth-service:8001
      JWKS_URL: http://auth-service:8001/.well-known/jwks.json
      MINIO_ENDPOINT: generation-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: documents
      MINIO_TEMPLATES_BUCKET: templates
      MINIO_SECURE: "false"
      PRESIGNED_URL_EXPIRY: 900
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      APP_VERSION: "1.0.0"
    depends_on:
      generation-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - generation-net

  generation-minio:
    image: minio/minio:latest
    container_name: generation-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO Console: http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - generation-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - generation-net

  generation-minio-setup:
    image: minio/mc:latest
    container_name: generation-minio-setup
    depends_on:
      generation-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://generation-minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/templates;
      mc cp /dotx/gost-2105-template.dotx local/templates/dotx/gost-2105-template.dotx;
      echo 'MinIO setup complete';
      "
    volumes:
      - ../generation-service/assets:/dotx:ro
    networks:
      - generation-net
    restart: "no"

networks:
  generation-net:
    driver: bridge

volumes:
  generation-minio-data:
