version: "3.9"

services:
  # ============================================================
  # API Gateway
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # для TLS
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      generation-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Auth Service
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secret}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      JWT_ALGORITHM: RS256
      ENCRYPT_KEY_PHONE: ${ENCRYPT_KEY_PHONE:-generate_me}
      ENCRYPT_KEY_TOTP: ${ENCRYPT_KEY_TOTP:-generate_me}
      PASSWORD_MIN_LENGTH: 12
      PASSWORD_HISTORY_SIZE: 10
      PASSWORD_EXPIRY_DAYS: 90
      ARGON2_TIME_COST: 3
      ARGON2_MEMORY_COST: 65536
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_SECONDS: 1800
      MAX_CONCURRENT_SESSIONS: 3
      IDLE_TIMEOUT_SECONDS: 1800
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secret}
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Catalog Service
  # ============================================================
  catalog-service:
    build: ./catalog-service
    ports:
      - "8002:8002"
    environment:
      MONGO_HOST: catalog-mongodb
      MONGO_PORT: 27017
      MONGO_DB: catalog_db
      MONGO_USER: catalog_user
      MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:-catalog_secret}
      AUTH_SERVICE_URL: http://auth-service:8001
      WORKFLOW_SERVICE_URL: http://workflow-service:8004
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
    depends_on:
      catalog-mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  catalog-mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_user
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD:-catalog_secret}
      MONGO_INITDB_DATABASE: catalog_db
    volumes:
      - catalog-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Generation Service
  # ============================================================
  generation-service:
    build: ./generation-service
    ports:
      - "8003:8003"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8002
      AUTH_SERVICE_URL: http://auth-service:8001
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: documents
      MINIO_TEMPLATES_BUCKET: templates
      MINIO_USE_SSL: "false"
      PRESIGNED_URL_EXPIRY: 900
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
    depends_on:
      minio:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Workflow Service
  # ============================================================
  workflow-service:
    build: ./workflow-service
    ports:
      - "8004:8004"
    environment:
      DB_HOST: workflow-postgres
      DB_PORT: 5432
      DB_NAME: workflow_db
      DB_USER: workflow_user
      DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:-workflow_secret}
      AUTH_SERVICE_URL: http://auth-service:8001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
    depends_on:
      workflow-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  workflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD:-workflow_secret}
    volumes:
      - workflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MinIO (Object Storage)
  # ============================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MinIO Setup (create buckets on first start)
  # ============================================================
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing myminio/documents;
      mc mb --ignore-existing myminio/templates;
      echo 'Buckets created';
      "

volumes:
  auth-pg-data:
  workflow-pg-data:
  catalog-mongo-data:
  minio-data:
