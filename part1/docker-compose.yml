services:
  # ============================================================
  # Frontend builder — копирует собранный SPA в volume для nginx
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend-dist:/output
    restart: "no"

  # ============================================================
  # API Gateway
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # для TLS
    depends_on:
      frontend:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      generation-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      pmi-agent:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Auth Service
  # ============================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8001:8001"
    secrets:
      - jwt_private
      - jwt_public
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secret}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 604800
      JWT_ALGORITHM: RS256
      ENCRYPT_KEY_PHONE: ${ENCRYPT_KEY_PHONE:-generate_me}
      ENCRYPT_KEY_TOTP: ${ENCRYPT_KEY_TOTP:-generate_me}
      PASSWORD_MIN_LENGTH: 12
      PASSWORD_HISTORY_SIZE: 10
      PASSWORD_EXPIRY_DAYS: 90
      ARGON2_TIME_COST: 3
      ARGON2_MEMORY_COST: 65536
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_SECONDS: 1800
      MAX_CONCURRENT_SESSIONS: 3
      IDLE_TIMEOUT_SECONDS: 1800
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      REDIS_URL: redis://redis:6379/3
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secret}
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Catalog Service
  # ============================================================
  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      MONGO_HOST: catalog-mongodb
      MONGO_PORT: 27017
      MONGO_DB: catalog_db
      MONGO_USER: catalog_user
      MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:-catalog_secret}
      JWKS_URL: http://auth-service:8001/.well-known/jwks.json
      JWT_PUBLIC_KEY_PATH: ""
      AUTH_SERVICE_URL: http://auth-service:8001
      WORKFLOW_SERVICE_URL: http://workflow-service:8004
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      catalog-mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  catalog-mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: catalog_user
      MONGO_INITDB_ROOT_PASSWORD: ${CATALOG_MONGO_PASSWORD:-catalog_secret}
      MONGO_INITDB_DATABASE: catalog_db
    volumes:
      - catalog-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Generation Service
  # ============================================================
  generation-service:
    build:
      context: .
      dockerfile: generation-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8002
      AUTH_SERVICE_URL: http://auth-service:8001
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: documents
      MINIO_TEMPLATES_BUCKET: templates
      MINIO_ARCHIVE_BUCKET: documents-archive
      MINIO_SECURE: "false"
      PRESIGNED_URL_EXPIRY: 900
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      REDIS_URL: redis://redis:6379/1
      ARCHIVE_AFTER_DAYS: ${ARCHIVE_AFTER_DAYS:-90}
      ARCHIVE_INTERVAL_HOURS: ${ARCHIVE_INTERVAL_HOURS:-24}
    depends_on:
      minio:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Workflow Service
  # ============================================================
  workflow-service:
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      DB_HOST: workflow-postgres
      DB_PORT: 5432
      DB_NAME: workflow_db
      DB_USER: workflow_user
      DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:-workflow_secret}
      JWKS_URL: http://auth-service:8001/.well-known/jwks.json
      JWT_PUBLIC_KEY_PATH: ""
      AUTH_SERVICE_URL: http://auth-service:8001
      CATALOG_INTERNAL_URL: http://catalog-service:8002
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/2
    depends_on:
      workflow-postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  workflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD:-workflow_secret}
    volumes:
      - workflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # MinIO (Object Storage)
  # ============================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Kafka (KRaft mode — no ZooKeeper)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Kafka UI — http://localhost:9080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped

  # ============================================================
  # MinIO Setup (create buckets on first start)
  # ============================================================
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./generation-service/assets:/dotx:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing myminio/documents;
      mc mb --ignore-existing myminio/templates;
      mc mb --ignore-existing myminio/documents-archive;
      mc cp /dotx/gost-2105-template.dotx myminio/templates/dotx/gost-2105-template.dotx;
      echo 'MinIO setup complete';
      "

  # ============================================================
  # PMI Agent Stack
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    # Раскомментировать при наличии GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        ollama pull mistral:7b-instruct &&
        echo 'Model loaded successfully'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  chromadb:
    image: chromadb/chroma:0.5.0
    restart: unless-stopped
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_TOKEN:-pmi-chroma-token}
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pmi-agent:
    build:
      context: ./pmi-agent
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      chromadb:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    shm_size: "1gb"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_TOKEN: ${CHROMA_TOKEN:-pmi-chroma-token}
      CATALOG_SERVICE_URL: http://catalog-service:8002
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-internal_secret}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # URL для Playwright — nginx внутри Docker-сети
      TARGET_APP_URL: http://nginx:80
    volumes:
      - pmi-outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ============================================================
  # Redis (кеш + хранилище для rate limiter)
  # ============================================================
  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Observability: Prometheus + Grafana + Loki + Promtail
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.5
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.5
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  auth-pg-data:
  workflow-pg-data:
  catalog-mongo-data:
  minio-data:
  kafka-data:
  frontend-dist:
  ollama-data:
  chromadb-data:
  pmi-outputs:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem
