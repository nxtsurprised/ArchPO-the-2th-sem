global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pmi-agent"
    static_configs:
      - targets: ["pmi-agent:8006"]
    metrics_path: /metrics

  - job_name: "chromadb"
    static_configs:
      - targets: ["chromadb:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
