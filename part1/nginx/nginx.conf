worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'request_id=$request_id';

    access_log /var/log/nginx/access.log main;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate limiting zone for login endpoint
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

    # Docker's embedded DNS — re-resolve backend hostnames every 30s.
    # Required for proxy_pass with variables so nginx picks up new IPs
    # when containers are recreated without restarting nginx.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Pass X-Request-ID to all upstreams
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Return X-Request-ID to client
        add_header X-Request-ID $request_id always;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Request-ID, X-Idempotency-Key' always;
        add_header 'Access-Control-Max-Age' 86400 always;

        # CORS preflight — headers already set above, just return 204
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ============================================================
        # Block /internal/* from external access
        # ============================================================
        location /internal/ {
            return 403;
        }

        location /.well-known/ {
            return 403;
        }

        # ============================================================
        # Auth Service
        # ============================================================
        location /api/auth/ {
            set $auth_backend http://auth-service:8001;
            proxy_pass $auth_backend;
            proxy_read_timeout 30s;
        }

        # JWKS — public endpoint (accessible internally, blocked externally above)
        # Services access directly: http://auth-service:8001/.well-known/jwks.json

        # Login — rate limited
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $auth_backend http://auth-service:8001;
            proxy_pass $auth_backend;
        }

        # ============================================================
        # Catalog Service
        # ============================================================
        location /api/catalog/ {
            set $catalog_backend http://catalog-service:8002;
            proxy_pass $catalog_backend;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Generation Service
        # ============================================================
        location /api/generation/ {
            set $generation_backend http://generation-service:8003;
            proxy_pass $generation_backend;
            proxy_read_timeout 120s;  # генерация может занимать время
        }

        # ============================================================
        # Workflow Service
        # ============================================================
        location /api/workflow/ {
            set $workflow_backend http://workflow-service:8004;
            proxy_pass $workflow_backend;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Frontend (static files)
        # ============================================================
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Health check for nginx itself
        location = /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }

    # ============================================================
    # HTTPS server (uncomment for TLS)
    # ============================================================
    # server {
    #     listen 443 ssl;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     # ... same location blocks as above
    # }
}
