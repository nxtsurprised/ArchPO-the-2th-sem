worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'request_id=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate limiting zone for login endpoint
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

    # Generate X-Request-ID if not present
    map $http_x_request_id $request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream auth_service {
        server auth-service:8001;
    }

    upstream catalog_service {
        server catalog-service:8002;
    }

    upstream generation_service {
        server generation-service:8003;
    }

    upstream workflow_service {
        server workflow-service:8004;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Pass X-Request-ID to all upstreams
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Return X-Request-ID to client
        add_header X-Request-ID $request_id always;

        # CORS headers (for SPA on different port)
        set $cors_origin $http_origin;

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Request-ID, X-Idempotency-Key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ============================================================
        # Block /internal/* from external access
        # ============================================================
        location /internal/ {
            return 403;
        }

        location /.well-known/ {
            return 403;
        }

        # ============================================================
        # Auth Service
        # ============================================================
        location /api/auth/ {
            proxy_pass http://auth_service/api/auth/;
            proxy_read_timeout 30s;
        }

        # JWKS — public endpoint (accessible internally, blocked externally above)
        # Services access directly: http://auth-service:8001/.well-known/jwks.json

        # Login — rate limited
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_service/api/auth/login;
        }

        # ============================================================
        # Catalog Service
        # ============================================================
        location /api/catalog/ {
            proxy_pass http://catalog_service/api/catalog/;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Generation Service
        # ============================================================
        location /api/generation/ {
            proxy_pass http://generation_service/api/generation/;
            proxy_read_timeout 120s;  # генерация может занимать время
        }

        # ============================================================
        # Workflow Service
        # ============================================================
        location /api/workflow/ {
            proxy_pass http://workflow_service/api/workflow/;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Frontend (static files)
        # ============================================================
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Health check for nginx itself
        location = /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }

    # ============================================================
    # HTTPS server (uncomment for TLS)
    # ============================================================
    # server {
    #     listen 443 ssl;
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     # ... same location blocks as above
    # }
}
